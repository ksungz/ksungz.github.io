<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">최근 7일 cron 작업별 누적 입력 토큰과 API 호출 비교</title>
  <desc id="desc">4시간 작업 로그가 약 1,654만 입력 토큰과 520회의 API 호출로 가장 많은 자원을 사용했다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; letter-spacing: 0; }
    .title { font-size: 30px; font-weight: 700; fill: #191b1a; }
    .subtitle { font-size: 16px; fill: #6a6f6c; }
    .header { font-size: 14px; font-weight: 600; fill: #858a87; }
    .label { font-size: 17px; font-weight: 600; fill: #252826; }
    .value { font-size: 17px; font-weight: 700; fill: #252826; }
    .calls { font-size: 17px; font-weight: 600; fill: #505552; }
    .note { font-size: 14px; fill: #747a76; }
  </style>
  <rect width="1200" height="720" fill="#f1f3f0"/>
  <rect x="24" y="24" width="1152" height="672" rx="8" fill="#ffffff" stroke="#dfe3df"/>

  <text x="60" y="78" class="title">최근 7일 cron 작업 비용</text>
  <text x="60" y="112" class="subtitle">에이전트 세션에 기록된 입력 토큰과 API 호출을 작업별로 합산</text>

  <text x="60" y="166" class="header">작업</text>
  <text x="320" y="166" class="header">누적 입력 토큰</text>
  <text x="920" y="166" class="header">합계</text>
  <text x="1090" y="166" text-anchor="middle" class="header">API 호출</text>
  <line x1="60" y1="181" x2="1140" y2="181" stroke="#e6e9e6"/>

  <text x="60" y="222" class="label">4시간 작업 로그</text>
  <rect x="320" y="194" width="560" height="42" rx="4" fill="#edf0ed"/>
  <rect x="320" y="194" width="560" height="42" rx="4" fill="#c65348"/>
  <text x="920" y="222" class="value">1,654만</text>
  <text x="1090" y="222" text-anchor="middle" class="calls">520회</text>

  <text x="60" y="312" class="label">데일리 트렌드</text>
  <rect x="320" y="284" width="560" height="42" rx="4" fill="#edf0ed"/>
  <rect x="320" y="284" width="285" height="42" rx="4" fill="#d69a36"/>
  <text x="920" y="312" class="value">842만</text>
  <text x="1090" y="312" text-anchor="middle" class="calls">143회</text>

  <text x="60" y="402" class="label">일일 메모리 생성</text>
  <rect x="320" y="374" width="560" height="42" rx="4" fill="#edf0ed"/>
  <rect x="320" y="374" width="78" height="42" rx="4" fill="#648477"/>
  <text x="920" y="402" class="value">231만</text>
  <text x="1090" y="402" text-anchor="middle" class="calls">78회</text>

  <text x="60" y="492" class="label">모델 사용량 집계</text>
  <rect x="320" y="464" width="560" height="42" rx="4" fill="#edf0ed"/>
  <rect x="320" y="464" width="71" height="42" rx="4" fill="#78968a"/>
  <text x="920" y="492" class="value">211만</text>
  <text x="1090" y="492" text-anchor="middle" class="calls">74회</text>

  <text x="60" y="582" class="label">모델 목록 확인</text>
  <rect x="320" y="554" width="560" height="42" rx="4" fill="#edf0ed"/>
  <rect x="320" y="554" width="24" height="42" rx="4" fill="#9aaba4"/>
  <text x="920" y="582" class="value">47만</text>
  <text x="1090" y="582" text-anchor="middle" class="calls">15회</text>

  <line x1="60" y1="630" x2="1140" y2="630" stroke="#e6e9e6"/>
  <text x="60" y="662" class="note">2026-07-07~2026-07-13 · 입력 토큰은 API 호출마다 반복된 문맥을 포함한 누적값</text>
</svg>
